name: Release Windows installers

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: AION 2 Companion Overlay v__VERSION__
          releaseBody: |
            Windows preview release.

            Download the NSIS `setup.exe` for the simplest installation, or the `.msi` package for managed installation.

            This preview is currently unsigned, so Windows SmartScreen may display an unknown publisher warning.
          releaseDraft: true
          prerelease: true
